<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#161f36"/>
      <stop offset="52%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#060912"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#82b7ff"/>
      <stop offset="50%" stop-color="#5ee3b4"/>
      <stop offset="100%" stop-color="#bf92ff"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#6fa8ff"/>
    </radialGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#82b7ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5ee3b4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#82b7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="118" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="118" fill="none" stroke="url(#borderGrad)" stroke-width="7" opacity="0.95"/>
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Ambient halo -->
  <circle cx="256" cy="256" r="196" fill="url(#haloGrad)"/>

  <!-- Neural mesh edges -->
  <g stroke="#94a5c2" stroke-opacity="0.28" stroke-width="3.5" stroke-linecap="round">
    <line x1="256" y1="118" x2="375.5" y2="187"/>
    <line x1="375.5" y1="187" x2="375.5" y2="325"/>
    <line x1="375.5" y1="325" x2="256" y2="394"/>
    <line x1="256" y1="394" x2="136.5" y2="325"/>
    <line x1="136.5" y1="325" x2="136.5" y2="187"/>
    <line x1="136.5" y1="187" x2="256" y2="118"/>
  </g>
  <g stroke="#82b7ff" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="118"/>
    <line x1="256" y1="256" x2="375.5" y2="187"/>
    <line x1="256" y1="256" x2="375.5" y2="325"/>
    <line x1="256" y1="256" x2="256" y2="394"/>
    <line x1="256" y1="256" x2="136.5" y2="325"/>
    <line x1="256" y1="256" x2="136.5" y2="187"/>
  </g>

  <!-- Dashed outer orbit -->
  <circle cx="256" cy="256" r="178" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="2 10"/>

  <!-- Outer nodes -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="118" r="21" fill="#82b7ff"/>
    <circle cx="375.5" cy="187" r="21" fill="#5ee3b4"/>
    <circle cx="375.5" cy="325" r="21" fill="#bf92ff"/>
    <circle cx="256" cy="394" r="21" fill="#56d9ff"/>
    <circle cx="136.5" cy="325" r="21" fill="#ffd869"/>
    <circle cx="136.5" cy="187" r="21" fill="#ff7aa8"/>
  </g>

  <!-- Core -->
  <circle cx="256" cy="256" r="64" fill="#82b7ff" opacity="0.35" filter="url(#coreBlur)"/>
  <circle cx="256" cy="256" r="52" fill="url(#coreGlow)" filter="url(#softGlow)"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <circle cx="240" cy="238" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="256" cy="256" r="8" fill="#0b101d" opacity="0.35"/>
</svg>
