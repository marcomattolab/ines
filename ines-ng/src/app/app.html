<app-status-bar (openLoader)="overlayOpen.set(true)" />

    <app-loader-overlay
      [visible]="overlayOpen()"
      (closed)="overlayOpen.set(false)" />

    <div id="app">
      <!-- Sidebar -->
      <nav id="sidebar">
        @for (tab of tabs; track tab.id) {
          <button class="tab-btn"
            [class.active]="activeTab() === tab.id"
            [style.--tab-color]="tab.color"
            (click)="activeTab.set(tab.id)">
            <span class="tab-icon">
               <mat-icon [fontIcon]="tab.icon" style="width: 20px; height: 20px; font-size: 20px;"></mat-icon>
            </span>
            <span class="tab-label">{{ tab.label }}</span>
          </button>
        }
        <div class="sidebar-spacer"></div>
      </nav>

      <!-- Main panels -->
      <main id="main">
        <app-chat-tab [hidden]="activeTab() !== 'chat'" />
        <app-email-tab [hidden]="activeTab() !== 'email'" />
        <app-meeting-tab [hidden]="activeTab() !== 'meeting'" />
        <app-translate-tab [hidden]="activeTab() !== 'translate'" />
        <app-todo-tab [hidden]="activeTab() !== 'todo'" />
        <app-coding-tab [hidden]="activeTab() !== 'coding'" />
      </main>
    </div>

    <!-- App Footer -->
    <footer id="app-footer">
      INES - Intelligent Neural Edge System - Powered by <a href="https://marcomartorana.it/about/" target="_blank">Marco Martorana</a> © 2026
    </footer>

    <!-- Toast notifications -->
    @for (t of toast.toasts(); track t.id) {
      <div class="toast">{{ t.msg }}</div>
    }
