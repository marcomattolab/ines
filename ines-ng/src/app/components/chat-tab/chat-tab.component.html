<div class="tab-panel-inner">
  <div class="panel-header">
    <div>
      <div class="panel-title">
        <lucide-angular name="message-square" [size]="18" class="text-accent-blue"></lucide-angular>
        General Assistant
      </div>
      <div class="panel-desc">AI on-device · private · offline</div>
    </div>
    <app-button variant="danger" size="sm" (onClick)="clear()">
      <lucide-angular name="trash-2" [size]="14"></lucide-angular>
      Clear
    </app-button>
  </div>

  <div class="chat-area" #chatArea>
    @for (msg of messages(); track msg.id) {
    @if (msg.role === 'ai' && msg.streaming) {
    <div class="message ai">
      <div class="msg-avatar">Ines</div>
      <div class="msg-bubble cursor-blink" [innerHTML]="html(msg.text)"></div>
    </div>
    } @else {
    <app-message-bubble [role]="msg.role" [text]="msg.text" [streaming]="!!msg.streaming" />
    }
    }
    @if (typing()) {
    <div class="message ai">
      <div class="msg-avatar">Ines</div>
      <div class="msg-bubble"><app-typing-indicator /></div>
    </div>
    }
  </div>

  <div class="token-info">{{ tokenInfo() }}</div>

  <div class="input-zone">
    <textarea class="input-field" #inputEl placeholder="Write a message..." rows="1" (keydown)="onKey($event)"
      (input)="autoResize($event)"></textarea>
    <app-button variant="primary" [disabled]="generating()" (onClick)="send()" title="Send (Enter)" className="!rounded-full !w-11 !h-11 !p-0">
      <lucide-angular name="send" [size]="18"></lucide-angular>
    </app-button>
  </div>
</div>
