<div class="hub">
  <nav class="hub-nav" aria-label="Code tools">
    @for (t of tools; track t.id) {
      <button
        type="button"
        class="hub-chip"
        [class.active]="active() === t.id"
        [style.--chip-accent]="t.hex"
        (click)="active.set(t.id)"
      >
        <mat-icon [fontIcon]="t.icon" class="text-sm w-4 h-4 {{ t.color }}"></mat-icon>
        {{ t.label }}
      </button>
    }
  </nav>

  <div class="hub-content">
    @if (active() === 'coding') {
      <app-coding-tab />
    } @else if (active() === 'dev-agent') {
      <app-dev-agent-tab />
    } @else if (active() === 'agents') {
      <app-agents-tab />
    }
  </div>
</div>
