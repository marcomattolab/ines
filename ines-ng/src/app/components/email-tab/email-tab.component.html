<div class="tab-panel-inner">
      <div class="panel-header">
        <div>
          <div class="panel-title"><span class="panel-title-icon">✉️</span> Email Assistant</div>
          <div class="panel-desc">Rewrite, improve and adapt the tone of your emails</div>
        </div>
        <button class="btn-danger" (click)="clear()">🗑 Clear</button>
      </div>

      <div class="controls-row">
        <select class="pill-select" [(ngModel)]="tone">
          <option value="professional">🎩 Professional</option>
          <option value="friendly">😊 Friendly</option>
          <option value="assertive">💪 Assertive</option>
          <option value="formal">📜 Formal</option>
          <option value="concise">⚡ Short and Concise</option>
        </select>
        <select class="pill-select" [(ngModel)]="action">
          <option value="improve">✨ Improve</option>
          <option value="fix">🔧 Fix grammar</option>
          <option value="shorten">✂️ Shorten</option>
          <option value="formal">🎩 Formal</option>
          <option value="reply">↩️ Reply</option>
          <option value="summary">📋 Summary</option>
        </select>
        <button class="btn-primary" [disabled]="processing()" (click)="process()">
          {{ processing() ? '⏳ Processing...' : '⚡ Process' }}
        </button>
      </div>

      <div class="email-input-area">
        <textarea class="email-original" #emailInput
          placeholder="Paste the email to improve or process here..."></textarea>
        <div class="email-result-wrap">
          <div class="email-result-label">
            <span>✦ RESULT</span>
            @if (result()) {
              <button class="btn-secondary" (click)="copy()">📋 Copy</button>
            }
          </div>
          <div class="email-result-content">
            @if (result()) {
              <span [class.cursor-blink]="processing()" [innerHTML]="resultHtml()"></span>
            } @else {
              <div class="empty-state">
                <div class="empty-icon">✉️</div>
                <div class="empty-text">Paste an email above, choose the tone and action, then click Process</div>
              </div>
            }
          </div>
        </div>
      </div>
    </div>
