<div class="hub">
  <nav class="hub-nav" aria-label="Knowledge tools">
    @for (t of tools; track t.id) {
      <button
        type="button"
        class="hub-chip"
        [class.active]="active() === t.id"
        (click)="active.set(t.id)"
      >
        <mat-icon [fontIcon]="t.icon" class="text-sm w-4 h-4 {{ t.color }}"></mat-icon>
        {{ t.label }}
      </button>
    }
  </nav>

  <div class="hub-content">
    @if (active() === 'brain') {
      <app-brain-tab />
    } @else if (active() === 'project') {
      <app-project-tab />
    }
  </div>
</div>
