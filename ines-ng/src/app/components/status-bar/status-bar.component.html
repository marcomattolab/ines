<div
  class="h-12 bg-[var(--bg-1)] border-b border-[var(--border)] flex items-center justify-between px-5 backdrop-blur-md"
>
  <div class="flex items-center gap-2.5 cursor-pointer transition-transform hover:scale-[1.03]">
    <img
      src="ines-mark.svg"
      alt="INES Logo"
      class="w-8 h-8 object-contain"
      style="filter: drop-shadow(0 2px 10px rgba(99, 179, 255, 0.45))"
    />
    <span
      class="font-[var(--font-ui)] font-extrabold text-lg -tracking-[0.01em] bg-gradient-to-r from-[var(--accent-blue)] to-[var(--accent-green)] bg-clip-text text-transparent"
      >INES</span
    >
  </div>
  <div class="flex items-center gap-2.5 font-[var(--font-mono)] text-xs text-[var(--text-2)]">
    <div class="status-dot" [class]="llm.modelStatus()"></div>
    <span class="flex items-center gap-1">
      @switch (llm.modelStatus()) {
        @case ('idle') {
          {{ i18n.t('status.noModel') }}
        }
        @case ('loading') {
          <mat-icon fontIcon="hourglass_empty" class="animate-spin text-sm w-3.5 h-3.5"></mat-icon>
          {{ i18n.t('status.loading') }}
        }
        @case ('ready') {
          <mat-icon
            fontIcon="check_circle"
            class="text-accent-green text-sm w-3.5 h-3.5"
          ></mat-icon>
          {{ llm.modelName() }}
        }
        @case ('error') {
          <mat-icon fontIcon="error" class="text-accent-rose text-sm w-3.5 h-3.5"></mat-icon>
          Error
        }
      }
    </span>
    <app-button
      [variant]="isDictating() ? 'danger' : 'secondary'"
      size="sm"
      (onClick)="toggleDictation()"
      [ariaLabel]="isDictating() ? i18n.t('status.dictate.stop') : i18n.t('status.dictate.start')"
      [title]="isDictating() ? i18n.t('status.dictate.stop') : i18n.t('status.dictate.start')"
    >
      <mat-icon
        [fontIcon]="isDictating() ? 'mic_off' : 'mic'"
        class="text-sm w-3.5 h-3.5"
        [class.text-accent-rose]="isDictating()"
      ></mat-icon>
    </app-button>
    <app-button variant="secondary" size="sm" (onClick)="openLoader.emit()">
      <mat-icon fontIcon="refresh" class="text-sm w-3.5 h-3.5"></mat-icon>
      {{ i18n.t('status.loadModel') }}
    </app-button>
    <app-button
      variant="secondary"
      size="sm"
      (onClick)="openInfo.emit()"
      [ariaLabel]="i18n.t('status.about')"
      [title]="i18n.t('status.about')"
    >
      <mat-icon fontIcon="info" class="text-sm w-3.5 h-3.5"></mat-icon>
    </app-button>
  </div>
</div>
