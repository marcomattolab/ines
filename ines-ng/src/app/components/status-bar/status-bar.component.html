<div
  class="h-11 bg-[var(--bg-1)] border-b border-[var(--border)] flex items-center justify-between px-5 backdrop-blur-md"
>
  <div class="flex items-center gap-2.5 cursor-pointer transition-transform hover:scale-[1.03]">
    <img
      src="ines-logo.png"
      alt="INES Logo"
      class="w-6 h-6 object-contain"
      style="filter: drop-shadow(0 2px 6px rgba(99, 179, 255, 0.4))"
    />
    <span
      class="font-[var(--font-ui)] font-extrabold text-base -tracking-[0.01em] bg-gradient-to-r from-[var(--accent-blue)] to-[var(--accent-green)] bg-clip-text text-transparent"
      >INES</span
    >
  </div>
  <div class="flex items-center gap-2.5 font-[var(--font-mono)] text-[11px] text-[var(--text-2)]">
    <div class="status-dot" [class]="llm.modelStatus()"></div>
    <span class="flex items-center gap-1">
      @switch (llm.modelStatus()) {
        @case ('idle') {
          No model loaded
        }
        @case ('loading') {
          <mat-icon fontIcon="hourglass_empty" class="animate-spin text-sm w-3.5 h-3.5"></mat-icon>
          Loading...
        }
        @case ('ready') {
          <mat-icon
            fontIcon="check_circle"
            class="text-accent-green text-sm w-3.5 h-3.5"
          ></mat-icon>
          {{ llm.modelName() }}
        }
        @case ('error') {
          <mat-icon fontIcon="error" class="text-accent-rose text-sm w-3.5 h-3.5"></mat-icon>
          Error
        }
      }
    </span>
    <app-button variant="secondary" size="sm" (onClick)="openLoader.emit()">
      <mat-icon fontIcon="refresh" class="text-sm w-3.5 h-3.5"></mat-icon>
      Load Model
    </app-button>
    <app-button variant="secondary" size="sm" (onClick)="openInfo.emit()" title="About INES">
      <mat-icon fontIcon="info" class="text-sm w-3.5 h-3.5"></mat-icon>
    </app-button>
  </div>
</div>
