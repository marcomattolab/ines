<div id="status-bar">
      <div class="brand">
        <img src="ines-logo.png" alt="INES Logo" class="brand-logo" />
        <span class="brand-text">INES</span>
      </div>
      <div id="model-status">
        <div class="status-dot" [class]="llm.modelStatus()"></div>
        <span class="flex items-center gap-1">
          @switch (llm.modelStatus()) {
            @case ('idle')    { No model loaded }
            @case ('loading') { <lucide-angular name="loader-2" [size]="14" class="animate-spin"></lucide-angular> Loading... }
            @case ('ready')   { <lucide-angular name="check-circle-2" [size]="14" class="text-accent-green"></lucide-angular> {{ llm.modelName() }} }
            @case ('error')   { <lucide-angular name="alert-circle" [size]="14" class="text-accent-rose"></lucide-angular> Error }
          }
        </span>
        <app-button variant="secondary" size="sm" className="ml-2" (onClick)="openLoader.emit()">
          <lucide-angular name="refresh-cw" [size]="14"></lucide-angular>
          Load Model
        </app-button>
      </div>
    </div>
