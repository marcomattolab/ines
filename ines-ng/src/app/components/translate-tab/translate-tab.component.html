<div class="flex flex-col flex-1 overflow-hidden">
  <div class="panel-header">
    <div>
      <div class="panel-title">
        <mat-icon
          fontIcon="translate"
          class="text-accent-amber text-lg w-[18px] h-[18px]"
        ></mat-icon>
        Translator
      </div>
      <div class="panel-desc">Translate text between any language — completely offline</div>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <div class="flex flex-col flex-1 overflow-hidden">
      <div
        class="flex items-center gap-2.5 px-4 py-[10px] shrink-0 border-b border-[var(--border)]"
      >
        <!-- Source Language Dropdown -->
        <div class="relative flex-1 min-w-0" (click)="$event.stopPropagation()">
          <button
            class="pill-select flex items-center gap-2 w-full"
            (click)="fromLangOpen.set(!fromLangOpen())"
          >
            @if (fromLang() === 'auto') {
              <mat-icon
                fontIcon="auto_awesome"
                class="text-sm w-3.5 h-3.5 flex-shrink-0 text-accent-amber"
              ></mat-icon>
            }
            <span class="flex-1 text-left truncate">{{ getFromLangLabel() }}</span>
            <mat-icon
              fontIcon="expand_more"
              class="text-sm w-3.5 h-3.5 flex-shrink-0 transition-transform duration-200"
              [class.rotate-180]="fromLangOpen()"
            ></mat-icon>
          </button>
          @if (fromLangOpen()) {
            <div
              class="absolute top-full left-0 mt-1.5 z-50 min-w-full w-max max-w-[220px] bg-zinc-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-xl py-1 overflow-hidden"
            >
              <button
                class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-mono transition-colors hover:bg-white/5"
                [class.text-accent-amber]="fromLang() === 'auto'"
                [class.text-zinc-300]="fromLang() !== 'auto'"
                (click)="fromLang.set('auto'); fromLangOpen.set(false)"
              >
                <mat-icon
                  fontIcon="auto_awesome"
                  class="text-sm w-3.5 h-3.5 flex-shrink-0"
                ></mat-icon>
                <span>Auto-detect</span>
              </button>
              <div class="h-px bg-white/10 mx-2 my-1"></div>
              @for (lang of languages; track lang.value) {
                <button
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-mono transition-colors hover:bg-white/5"
                  [class.text-accent-amber]="fromLang() === lang.value"
                  [class.text-zinc-300]="fromLang() !== lang.value"
                  (click)="fromLang.set(lang.value); fromLangOpen.set(false)"
                >
                  <span>{{ lang.label }}</span>
                </button>
              }
            </div>
          }
        </div>
        <app-button
          variant="ghost"
          size="sm"
          [disabled]="!inputText().trim()"
          (onClick)="toggleSpeakSource()"
          className="!w-8 !h-8 !p-0"
          [attr.title]="isSourceSpeaking() ? 'Stop Reading' : 'Listen to Source Text'"
        >
          <mat-icon
            [fontIcon]="isSourceSpeaking() ? 'close' : 'volume_up'"
            class="text-sm w-3.5 h-3.5"
            [class.text-accent-amber]="isSourceSpeaking()"
          ></mat-icon>
        </app-button>
      </div>
      <textarea
        class="flex-1 bg-transparent border-none p-4 text-[var(--text-0)] font-[var(--font-body)] text-[15px] leading-[1.7] resize-none outline-none scrollbar-thin placeholder:text-[var(--text-2)]"
        placeholder="Text to translate..."
        [value]="inputText()"
        (input)="onInput($any($event.target).value)"
      ></textarea>
    </div>

    <div class="flex flex-col flex-1 overflow-hidden border-l border-[var(--border)]">
      <div
        class="flex items-center gap-2.5 px-4 py-[10px] shrink-0 border-b border-[var(--border)]"
      >
        <app-button
          variant="ghost"
          size="sm"
          [disabled]="fromLang() === 'auto' || !inputText().trim()"
          (onClick)="swap()"
          className="!w-8 !h-8 !p-0"
          title="Swap languages"
        >
          <mat-icon fontIcon="swap_horiz" class="text-sm w-3.5 h-3.5"></mat-icon>
        </app-button>
        <!-- Target Language Dropdown -->
        <div class="relative flex-1 min-w-0" (click)="$event.stopPropagation()">
          <button
            class="pill-select flex items-center gap-2 w-full"
            (click)="toLangOpen.set(!toLangOpen())"
          >
            <span class="flex-1 text-left truncate">{{ getToLangLabel() }}</span>
            <mat-icon
              fontIcon="expand_more"
              class="text-sm w-3.5 h-3.5 flex-shrink-0 transition-transform duration-200"
              [class.rotate-180]="toLangOpen()"
            ></mat-icon>
          </button>
          @if (toLangOpen()) {
            <div
              class="absolute top-full left-0 mt-1.5 z-50 min-w-full w-max max-w-[220px] bg-zinc-900/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-xl py-1 overflow-hidden"
            >
              @for (lang of languages; track lang.value) {
                <button
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-left text-xs font-mono transition-colors hover:bg-white/5"
                  [class.text-accent-amber]="toLang() === lang.value"
                  [class.text-zinc-300]="toLang() !== lang.value"
                  (click)="toLang.set(lang.value); toLangOpen.set(false)"
                >
                  <span>{{ lang.label }}</span>
                </button>
              }
            </div>
          }
        </div>
        <app-button
          variant="ghost"
          size="sm"
          [disabled]="!result().trim()"
          (onClick)="toggleSpeakResult()"
          className="!w-8 !h-8 !p-0"
          [attr.title]="isResultSpeaking() ? 'Stop Reading' : 'Listen to Translation'"
        >
          <mat-icon
            [fontIcon]="isResultSpeaking() ? 'close' : 'volume_up'"
            class="text-sm w-3.5 h-3.5"
            [class.text-accent-amber]="isResultSpeaking()"
          ></mat-icon>
        </app-button>
        <app-button
          variant="ghost"
          size="sm"
          [disabled]="!result().trim()"
          (onClick)="copy()"
          className="!w-8 !h-8 !p-0"
          title="Copy to Clipboard"
        >
          <mat-icon fontIcon="content_copy" class="text-sm w-3.5 h-3.5"></mat-icon>
        </app-button>
      </div>
      <div
        class="flex-1 overflow-y-auto p-4 text-[15px] leading-[1.7] text-[var(--text-0)] whitespace-pre-wrap font-[var(--font-body)] scrollbar-thin"
      >
        @if (result()) {
          <span [class.cursor-blink]="translating()" [innerHTML]="resultHtml()"></span>
        } @else {
          <span style="color: var(--text-2)">The translation will appear here...</span>
        }
      </div>
    </div>
  </div>

  <div
    class="flex gap-2.5 items-center px-[22px] py-3 border-t border-[var(--border)] bg-[var(--bg-1)] shrink-0"
  >
    <app-button variant="primary" (onClick)="translate()">
      <mat-icon fontIcon="translate" class="text-sm w-3.5 h-3.5"></mat-icon>
      Translate
    </app-button>
    <app-button variant="danger" (onClick)="clear()">
      <mat-icon fontIcon="delete" class="text-sm w-3.5 h-3.5"></mat-icon>
      Clear
    </app-button>
  </div>
</div>
