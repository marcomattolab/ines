<div class="message" [class.user]="role() === 'user'" [class.ai]="role() === 'ai'">
  <div class="msg-avatar">
    @if (role() === 'user') {
      <lucide-angular name="message-square" [size]="14"></lucide-angular>
    } @else {
      In
    }
  </div>
  <div class="msg-bubble" [class.cursor-blink]="streaming()">
    <span [innerHTML]="safeHtml()"></span>
    @if (role() === 'ai' && text()) {
    <div class="msg-actions" [class.visible]="isSpeaking()">
      <app-button variant="ghost" size="sm" (onClick)="toggleSpeak()" className="!w-8 !h-8 !p-0"
        [attr.title]="isSpeaking() ? 'Stop Reading' : 'Read Aloud'">
        <lucide-angular [name]="isSpeaking() ? 'x' : 'mic'" [size]="14"></lucide-angular>
      </app-button>
      <app-button variant="ghost" size="sm" (onClick)="copy()" className="!w-8 !h-8 !p-0" title="Copy to Clipboard">
        <lucide-angular name="copy" [size]="14"></lucide-angular>
      </app-button>
    </div>
    }
  </div>
</div>
